<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent DID 管理平台 · 集成准备中</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <div class="eyebrow">MEMO · AGENT DID MANAGEMENT PLATFORM</div>
    <h1>区块链集成准备中</h1>
    <p class="intro">项目使用 opBNB 测试链。下方状态显示当前合约连接和交易配置的验证结果。</p>
    <section class="status" aria-live="polite">
      <span class="dot"></span>
      <div><strong id="status-title">正在读取平台状态</strong><p id="status-detail">此页面不会发起链上交易。</p></div>
    </section>
    <section class="grid" aria-label="待实现能力">
      <article><span>01</span><h2>Agent 身份</h2><p>创建身份、注册 DID、解析与生命周期。</p></article>
      <article><span>02</span><h2>双向配对</h2><p>Invitation、Offer 与钱包管理授权。</p></article>
      <article><span>03</span><h2>链上操作</h2><p>签名、提交、确认、审计与重组恢复。</p></article>
    </section>
    <p class="note">上述功能均为待实现需求，不代表已经部署合约、连接测试链或提供可用的身份服务。详见仓库中的 <code>docs/BLOCKCHAIN_REQUIREMENTS.md</code>。</p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
