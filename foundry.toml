[profile.default]
src = "packages/contracts/src"
test = "packages/contracts/test"
script = "packages/contracts/script"
out = "packages/contracts/out"
cache_path = "packages/contracts/cache"
libs = ["node_modules"]
solc_version = "0.8.37"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts-paris/",
  "@account-abstraction/=node_modules/@account-abstraction/"
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
