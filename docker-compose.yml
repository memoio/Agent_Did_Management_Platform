name: memo-agent-did-mainnet-local

x-runtime-environment: &runtime-environment
  NODE_ENV: development
  MEMO_ENVIRONMENT: local
  MEMO_CHAIN_ID: "985"
  MEMO_NETWORK_NAME: "MEMO Mainnet Local"
  MEMO_NATIVE_CURRENCY_NAME: "MEMO"
  MEMO_NATIVE_CURRENCY_SYMBOL: "MEMO"
  MEMO_NATIVE_CURRENCY_DECIMALS: "18"
  MEMO_PRIMARY_RPC_URL: "http://anvil:8545"
  MEMO_SECONDARY_RPC_URL: "http://anvil:8545"
  MEMO_PUBLIC_RPC_URL: "http://127.0.0.1:9545"
  MEMO_BUNDLER_URL: "http://alto:4337"
  MEMO_REQUIRED_CONFIRMATIONS: "2"
  MEMO_DEPLOYMENT_MANIFEST: "/app/deploy/local/985.json"
  MEMO_DATA_ROOT: "/app/.data/local"
  MEMO_SESSION_SIGNING_KEY: "local-only-replace-before-any-shared-deployment"
  MEMO_RELAYER_OWNER_PROVIDER: "dev-private-key"
  MEMO_LOCAL_MNEMONIC: "test test test test test test test test test test test junk"
  MEMO_MIN_ENTRYPOINT_DEPOSIT_WEI: "100000000000000000"
  MEMO_PLATFORM_ORIGINS: "http://127.0.0.1:4273,http://localhost:4273"
  MEMO_DOCKER_LOCAL_NETWORK: "true"

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1@sha256:8347b728d5d393dac1c018691b36f506d23b9dcd78341d40ea0fcb11c3a19cdd
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "985"
      - "--block-time"
      - "1"
      - "--mnemonic"
      - "test test test test test test test test test test test junk"
    ports:
      - "127.0.0.1:9545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  deploy:
    build:
      context: .
      target: build
    environment:
      <<: *runtime-environment
    command: ["node", "scripts/deploy-contracts.mjs", "local"]
    volumes:
      - deployment-manifests:/app/deploy/local
    depends_on:
      anvil:
        condition: service_healthy
    restart: "no"

  alto:
    image: memo-agent-did-alto:v1.2.8-37cade5
    build:
      context: .
      dockerfile: infra/alto/Dockerfile
      additional_contexts:
        alto_source: https://github.com/pimlicolabs/alto.git#37cade5d2804a60ab30362ea27054514e1d7a7c8
    command:
      - "--entrypoints"
      - "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
      - "--executor-private-keys"
      - "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      - "--utility-private-key"
      - "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6"
      - "--min-executor-balance"
      - "0"
      - "--rpc-url"
      - "http://anvil:8545"
      - "--network-name"
      - "memo-local-985"
      - "--safe-mode"
      - "true"
      - "--port"
      - "4337"
    ports:
      - "127.0.0.1:4337:4337"
    depends_on:
      deploy:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:4337',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_supportedEntryPoints',params:[]})}).then(r=>{if(!r.ok)process.exit(1)})"
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *runtime-environment
      HOST: "0.0.0.0"
      PORT: "4273"
      NODE_ENV: development
    command: ["node", "dist/apps/api/src/main.js"]
    volumes:
      - deployment-manifests:/app/deploy/local:ro
      - local-data:/app/.data
    ports:
      - "127.0.0.1:4273:4273"
    depends_on:
      alto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4273/api/v1/chain/config').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  chain-worker:
    build:
      context: .
      target: runtime
    environment:
      <<: *runtime-environment
      NODE_ENV: development
      WORKER_POLL_MS: "250"
    command: ["node", "dist/apps/chain-worker/src/main.js"]
    volumes:
      - deployment-manifests:/app/deploy/local:ro
      - local-data:/app/.data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  deployment-manifests:
  local-data:
